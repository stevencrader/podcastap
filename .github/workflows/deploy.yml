name: Deploy
on:
  push:
    branches: master
  pull_request:
    branches: master

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build step
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          BASE_API_URL: ${{ secrets.BASE_API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          USER_AGENT: ${{ secrets.USER_AGENT }}
        run: deno task build

      # Requires a Deno Deploy access token from https://console.deno.com/account/access-tokens
      # and an app created on the new Deno Deploy platform (Deploy Classic sunsets 2026-07-20).
      - name: Deploy to Deno Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        working-directory: src
        run: >
          deno deploy
          --prod
          --non-interactive
          --org ${{ secrets.DENO_DEPLOY_ORG }}
          --app podcastap
